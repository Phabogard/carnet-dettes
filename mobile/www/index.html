<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Carnet de Dettes - Debt Tracker" />
  <title>Carnet de Dettes</title>
  <script src="https://cdn.jsdelivr.net/npm/@capacitor/core@latest/dist/capacitor.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f5f5f5;
      color: #333;
      line-height: 1.5;
    }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    header {
      background: #2c3e50;
      color: white;
      padding: 20px;
      margin: -20px -20px 20px -20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.5rem; }
    #sync-status {
      background: rgba(255,255,255,0.2);
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid #ddd;
    }
    .tab-btn {
      padding: 10px 15px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 1rem;
      border-bottom: 3px solid transparent;
      color: #666;
      transition: all 0.2s;
    }
    .tab-btn.active {
      color: #2c3e50;
      border-bottom-color: #2c3e50;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: 500;
      margin-bottom: 5px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 1rem;
      font-family: inherit;
    }
    textarea { resize: vertical; }
    button {
      background: #2c3e50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }
    button:hover { background: #1a252f; }
    button.danger {
      background: #e74c3c;
    }
    button.danger:hover { background: #c0392b; }
    .list-item {
      background: white;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 4px;
      border-left: 4px solid #2c3e50;
    }
    .list-item h3 {
      margin-bottom: 5px;
      font-size: 1rem;
    }
    .list-item p {
      font-size: 0.9rem;
      color: #666;
      margin: 5px 0;
    }
    .balance {
      background: #ecf0f1;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    .balance-item {
      text-align: center;
    }
    .balance-item .value {
      font-size: 1.5rem;
      font-weight: bold;
      color: #2c3e50;
    }
    .balance-item .label {
      font-size: 0.85rem;
      color: #666;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 8px;
      max-width: 400px;
      width: 90%;
    }
    .modal-content h2 {
      margin-bottom: 20px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .modal-actions button { flex: 1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Carnet de Dettes</h1>
      <span id="sync-status">⏳ Init</span>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="summary">Summary</button>
      <button class="tab-btn" data-tab="contacts">Contacts</button>
      <button class="tab-btn" data-tab="transactions">Transactions</button>
    </div>

    <!-- Summary Tab -->
    <div id="summary" class="tab-content active">
      <div class="balance">
        <div class="balance-item">
          <div class="value" id="to-receive">$0</div>
          <div class="label">To Receive</div>
        </div>
        <div class="balance-item">
          <div class="value" id="to-pay">$0</div>
          <div class="label">To Pay</div>
        </div>
      </div>
      <div id="summary-list"></div>
    </div>

    <!-- Contacts Tab -->
    <div id="contacts" class="tab-content">
      <div class="form-group">
        <button onclick="showContactForm()">+ Add Contact</button>
      </div>
      <div id="contacts-list"></div>
    </div>

    <!-- Transactions Tab -->
    <div id="transactions" class="tab-content">
      <div class="form-group">
        <button onclick="showTransactionForm()">+ Add Transaction</button>
      </div>
      <div id="transactions-list"></div>
    </div>
  </div>

  <!-- Contact Form Modal -->
  <div id="contact-modal" class="modal">
    <div class="modal-content">
      <h2>Add Contact</h2>
      <form id="contact-form">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="contact-name" required />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="contact-phone" />
        </div>
        <div class="modal-actions">
          <button type="button" onclick="closeModal('contact-modal')">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Transaction Form Modal -->
  <div id="transaction-modal" class="modal">
    <div class="modal-content">
      <h2>Add Transaction</h2>
      <form id="transaction-form">
        <div class="form-group">
          <label>Contact</label>
          <select id="transaction-contact" required></select>
        </div>
        <div class="form-group">
          <label>Type</label>
          <select id="transaction-type" required>
            <option value="lent">I Lent</option>
            <option value="borrowed">I Borrowed</option>
          </select>
        </div>
        <div class="form-group">
          <label>Amount</label>
          <input type="number" id="transaction-amount" step="0.01" required />
        </div>
        <div class="form-group">
          <label>Currency</label>
          <input type="text" id="transaction-currency" value="USD" />
        </div>
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="transaction-date" required />
        </div>
        <div class="form-group">
          <label>Due Date</label>
          <input type="date" id="transaction-due-date" />
        </div>
        <div class="form-group">
          <label>Note</label>
          <textarea id="transaction-note"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" onclick="closeModal('transaction-modal')">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- API Configuration Modal -->
  <div id="config-modal" class="modal">
    <div class="modal-content">
      <h2>API Configuration</h2>
      <div class="form-group">
        <label>API Base URL</label>
        <input type="url" id="api-url" placeholder="http://10.0.2.2:8000" />
      </div>
      <div class="modal-actions">
        <button type="button" onclick="closeModal('config-modal')">Cancel</button>
        <button onclick="testAndSaveApi()">Test & Sync</button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as db from './db.mjs';
    import * as sync from './sync.mjs';

    let app = { db, sync };
    window.app = app;

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        const tab = btn.dataset.tab;
        document.getElementById(tab).classList.add('active');
        if (tab === 'summary') loadSummary();
        else if (tab === 'contacts') loadContacts();
        else if (tab === 'transactions') loadTransactions();
      });
    });

    // Sync status
    document.getElementById('sync-status').addEventListener('click', () => {
      openModal('config-modal');
      document.getElementById('api-url').value = sync.getApiUrl();
    });

    // Contact form
    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      await db.createContact(
        document.getElementById('contact-name').value,
        document.getElementById('contact-phone').value
      );
      closeModal('contact-modal');
      loadContacts();
      await sync.pushChanges();
    });

    // Transaction form
    document.getElementById('transaction-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      await db.createTransaction(
        document.getElementById('transaction-contact').value,
        document.getElementById('transaction-type').value,
        parseFloat(document.getElementById('transaction-amount').value),
        document.getElementById('transaction-currency').value,
        document.getElementById('transaction-date').value,
        document.getElementById('transaction-due-date').value,
        document.getElementById('transaction-note').value
      );
      closeModal('transaction-modal');
      loadTransactions();
      await sync.pushChanges();
    });

    // Initialize
    (async () => {
      await db.initDB();
      await sync.initSyncMonitor();
      loadSummary();
    })();

    // Helper functions
    window.showContactForm = () => openModal('contact-modal');
    window.showTransactionForm = async () => {
      const contacts = await db.getContacts();
      const select = document.getElementById('transaction-contact');
      select.innerHTML = contacts.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      openModal('transaction-modal');
    };

    window.openModal = (id) => document.getElementById(id).classList.add('active');
    window.closeModal = (id) => document.getElementById(id).classList.remove('active');

    window.testAndSaveApi = async () => {
      const url = document.getElementById('api-url').value;
      sync.setApiUrl(url);
      const ok = await sync.testConnection();
      if (ok) {
        alert('Connection OK');
        closeModal('config-modal');
        await sync.pushChanges();
      } else {
        alert('Connection failed');
      }
    };

    async function loadSummary() {
      const summary = await sync.pullSummary();
      if (summary) {
        document.getElementById('to-receive').textContent = `$${summary.to_receive.toFixed(2)}`;
        document.getElementById('to-pay').textContent = `$${summary.to_pay.toFixed(2)}`;
        document.getElementById('summary-list').innerHTML = summary.by_contact.map(c =>
          `<div class="list-item"><h3>${c.name}</h3><p>Balance: $${c.balance}</p></div>`
        ).join('');
      }
    }

    async function loadContacts() {
      const contacts = await db.getContacts();
      document.getElementById('contacts-list').innerHTML = contacts.map(c =>
        `<div class="list-item"><h3>${c.name}</h3><p>${c.phone || 'No phone'}</p></div>`
      ).join('');
    }

    async function loadTransactions() {
      const txns = await db.getTransactions();
      document.getElementById('transactions-list').innerHTML = txns.map(t =>
        `<div class="list-item"><h3>${t.type}: $${t.amount} ${t.currency}</h3><p>${t.date}</p><p>${t.status}</p></div>`
      ).join('');
    }
  </script>
</body>
</html>
